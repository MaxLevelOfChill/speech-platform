<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой прогресс</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js для графиков -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">SpeechPlatform</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="diagnostic.html">Диагностика</a></li>
                    <li class="nav-item"><a class="nav-link" href="exercises.html">Упражнения</a></li>
                    <li class="nav-item"><a class="nav-link" href="progress.html">Прогресс</a></li>
                </ul>
                <ul class="navbar-nav" id="nav-auth"></ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <h2>Мой прогресс</h2>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Общая статистика</h5>
                        <p class="card-text" id="totalStats">Загрузка...</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Выполнено упражнений по категориям</h5>
                        <canvas id="progressChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <h3>Последняя диагностика</h3>
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Распознанный текст:</h5>
                    <p id="lastDiagnosticText" class="card-text">—</p>
                    <h5 class="card-title mt-3">Фонетика:</h5>
                    <p id="lastDiagnosticPhonetics" class="card-text" style="font-family: monospace;">—</p>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
