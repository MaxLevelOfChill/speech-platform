<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — SpeechPlatform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg sp-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">🎙️ SpeechPlatform</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto" id="nav-auth"></ul>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="auth-card">
            <h2 class="mb-1">С возвращением!</h2>
            <p class="text-muted mb-4">Войдите, чтобы сохранять прогресс и зарабатывать XP</p>
            <form id="loginForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" required placeholder="you@example.com">
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Пароль</label>
                    <input type="password" class="form-control" id="password" required>
                </div>
                <button type="submit" class="btn btn-sp-primary w-100">Войти</button>
            </form>
            <p class="mt-3 text-center mb-0">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
            <div id="loginError" class="text-danger mt-2 text-center"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="config.js"></script>
    <script src="exercises-data.js"></script>
    <script src="app.js"></script>
</body>
</html>
